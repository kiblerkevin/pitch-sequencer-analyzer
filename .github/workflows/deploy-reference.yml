---
name: Deploy Reference Image

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy to"
        required: true
        type: choice
        default: dev
        options:
          - dev
          - prod
      image_tag:
        description: "Image tag to deploy (defaults to the commit SHA)"
        required: false
        type: string
        default: ""

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      IMAGE_TAG: ${{ inputs.image_tag || github.sha }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ vars.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: services/ingestion
          file: services/ingestion/Dockerfile.reference
          platforms: linux/amd64
          push: true
          tags: |
            ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/psa-${{ inputs.environment }}-reference/reference:latest
            ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/psa-${{ inputs.environment }}-reference/reference:${{ env.IMAGE_TAG }}

      - name: Update Cloud Run jobs to use the versioned image
        run: |
          gcloud run jobs update psa-${{ inputs.environment }}-reference-job \
            --image=${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/psa-${{ inputs.environment }}-reference/reference:${{ env.IMAGE_TAG }} \
            --region=${{ vars.GCP_REGION }} \
            --project=${{ vars.GCP_PROJECT_ID }}

          gcloud run jobs update psa-${{ inputs.environment }}-daily-reference-job \
            --image=${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/psa-${{ inputs.environment }}-reference/reference:${{ env.IMAGE_TAG }} \
            --region=${{ vars.GCP_REGION }} \
            --project=${{ vars.GCP_PROJECT_ID }}
